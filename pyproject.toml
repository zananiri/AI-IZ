[project]
name = "docslides"
version = "0.1.0"
description = "Offline, multilingual document-to-PowerPoint generation system powered by a locally-hosted Qwen3-32B"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gradio>=4.44",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "python-pptx>=1.0.2",
    "lxml>=5.2",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "regex>=2024.7.24",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "tenacity>=8.5",
    "orjson>=3.10",
    "python-multipart>=0.0.9",
    "Pillow>=10.4",
]

[project.optional-dependencies]
# Heavy, environment-specific dependencies. Kept optional so the core package
# stays importable (e.g. for unit tests) on machines without a GPU or without
# every OCR/NLP model installed. See README.md for the install matrix.
ocr = [
    "paddleocr>=2.9",
    "paddlepaddle>=2.6",
    "pytesseract>=0.3.10",
    # Capped at <0.20 (0.16.7/0.17.0/0.17.1 -- next release is 0.20.0):
    # - 0.20.0 itself pins httpx<0.28, conflicting with magic-pdf's
    #   ultralytics-platform dependency needing httpx>=0.28.
    # - 0.21.2+ switched its transformers requirement to >=5.12.1, which
    #   conflicts with magic-pdf's own transformers<5.0 pin.
    # pip resolves ocr/ingestion-mineru in separate `pip install -e ".[...]"`
    # calls (see scripts/setup.ps1), so it won't catch either conflict
    # itself -- it'll happily downgrade httpx or upgrade transformers for
    # surya-ocr and silently break magic-pdf (TypeError/AttributeError at
    # OCR/formula-recognition time, not at install time). See also the
    # `legal` extra's sentence-transformers cap.
    "surya-ocr>=0.16.7,<0.20",
]
lang = [
    "fasttext-wheel>=0.9.2",
    "py3langid>=0.2.2",
    "spacy>=3.7",
    "stanza>=1.8",
]
ingestion-mineru = [
    # The bare "magic-pdf" install omits ultralytics/doclayout-yolo/
    # rapid-table/shapely etc. -- everything the layout/table/formula models
    # actually need at runtime -- gated behind this "full" extra instead.
    "magic-pdf[full]>=0.9",
    # magic-pdf[full] -> doclayout-yolo -> albumentations -> albucore pulls in
    # stringzilla, whose releases >=4.0 ship no Windows wheel (sdist-only,
    # requiring an MSVC C++ toolchain to build). Pin it to the last version
    # with a win_amd64 wheel so `pip install` doesn't need a compiler on
    # Windows; this still satisfies albucore's own ">=3.10.4" requirement.
    "stringzilla==3.10.4",
    # magic-pdf's default layout model (layoutlmv3) needs pycocotools (has a
    # Windows wheel, fine) AND detectron2 (no Windows wheel, needs a full
    # from-source MSVC/CUDA-matched build -- avoid it). Point
    # ~/magic-pdf.json's "layout-config" at {"model": "doclayout_yolo"}
    # instead (bundled in the [full] extra above, no detectron2 needed).
    "pycocotools>=2.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "reportlab>=4.2",
]
# Legal tab: local RAG over reviewed Israeli legal sources (see
# scripts/ingest_legal.py, src/docslides/legal/).
legal = [
    "chromadb>=0.5",
    # Capped at <6.0: 6.x requires transformers>=5.0, incompatible with
    # magic-pdf (ingestion-mineru extra)'s transformers<5.0 pin -- same
    # cross-extra hazard as the `ocr` extra's surya-ocr cap above, since this
    # extra is also installed via its own separate `pip install -e ".[legal]"`
    # call (README / requirements-legal-data.txt), not alongside ingestion-mineru.
    "sentence-transformers>=3.0,<6.0",
]
# Bulk legal corpus: fetchers + vectorize.py in scripts/legal_data/ (src/docslides/legal_data/).
# Use together with `legal` (chromadb, sentence-transformers). Also: requirements-legal-data.txt.
legal-data = [
    "pyarrow>=15",
    "mwparserfromhell>=0.6.6",
]

[project.scripts]
docslides-api = "docslides.api.main:run"
docslides-ui = "docslides.ui.gradio_app:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
