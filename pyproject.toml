[project]
name = "docslides"
version = "0.1.0"
description = "Offline, multilingual document-to-PowerPoint generation system powered by a locally-hosted Qwen3-32B"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gradio>=4.44",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "python-pptx>=1.0.2",
    "lxml>=5.2",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "regex>=2024.7.24",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "tenacity>=8.5",
    "orjson>=3.10",
    "python-multipart>=0.0.9",
    "Pillow>=10.4",
]

[project.optional-dependencies]
# Heavy, environment-specific dependencies. Kept optional so the core package
# stays importable (e.g. for unit tests) on machines without a GPU or without
# every OCR/NLP model installed. See README.md for the install matrix.
ocr = [
    "paddleocr>=2.9",
    "paddlepaddle>=2.6",
    "pytesseract>=0.3.10",
    "surya-ocr>=0.6",
]
lang = [
    "fasttext-wheel>=0.9.2",
    "py3langid>=0.2.2",
    "spacy>=3.7",
    "stanza>=1.8",
]
ingestion-mineru = [
    "magic-pdf>=0.9",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "reportlab>=4.2",
]

[project.scripts]
docslides-api = "docslides.api.main:run"
docslides-ui = "docslides.ui.gradio_app:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
