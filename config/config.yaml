# docslides configuration
# All model paths, thresholds, and language settings live here so the rest of
# the codebase never hardcodes environment- or language-specific assumptions.

llm:
  # "vllm" (NVIDIA GPU only, fastest) or "ollama" (CPU/CUDA/ROCm/Metal,
  # portable). Override per-environment without editing this file via the
  # DOCSLIDES_LLM_BACKEND / DOCSLIDES_LLM_BASE_URL / DOCSLIDES_LLM_MODEL env
  # vars -- see docker-compose.portable.yml and scripts/setup.*.
  backend: "vllm"
  base_url: "http://vllm:8000/v1"        # OpenAI-compatible endpoint served by vLLM
  model: "Qwen/Qwen3-32B-AWQ"             # verify against the current model repo before deploying
  api_key: "not-needed"                   # vLLM does not require a real key locally
  request_timeout_s: 600
  max_model_len: 8192
  guided_decoding_backend: "xgrammar"     # xgrammar | outlines
  # Per call-site defaults for the `enable_thinking` chat-template flag.
  thinking_defaults:
    outline_generation: true
    slide_fill: false
    translation: false
    chat_general: true
    tone_rewrite: true
    chunk_summary: false
  default_sampling:
    temperature: 0.6
    top_p: 0.92
    max_tokens: 2048

legal:
  # Legal tab: grounded RAG over Israeli law (src/docslides/legal/). Qwen
  # researches (Pass A memorandum), drafts (Pass B), and runs every
  # verification step; DictaLM only normalizes Hebrew queries and polishes
  # Hebrew replies. Sources are staged, human-reviewed and signed into the
  # index offline with scripts/ingest_legal.py. These are independent
  # deployments from the `llm:` section above.
  orchestrator:
    backend: "vllm"
    base_url: "http://vllm:8000/v1"
    model: "Qwen/Qwen3.5-32B-AWQ"                # verify against the current model repo before deploying
    api_key: "not-needed"
    request_timeout_s: 600
    # Must not exceed the served --max-model-len (docker-compose.yml:
    # QWEN_MAX_MODEL_LEN, default 8192). At 8192, retrieval.top_k and the
    # memo/draft output budgets are sized to fit; raise both together (e.g.
    # 16384) before enabling thinking for legal_research_memo.
    max_model_len: 8192
    guided_decoding_backend: "xgrammar"
    default_sampling:
      temperature: 0.2
      top_p: 0.9
      max_tokens: 2048
  # User-selectable DictaLM size for the Hebrew stages (Legal tab radio).
  # min_memory_gb are starting thresholds at ~4-bit quantization -- benchmark
  # on the target hardware before trusting the banner they drive.
  default_dicta_tier: "heavy"
  dicta_tiers:
    heavy:
      label: "Heavy — DictaLM-3.0-24B"
      min_memory_gb: 16
      llm:
        backend: "vllm"
        base_url: "http://vllm-dictalm:8000/v1"
        model: "dicta-il/DictaLM-3.0-24B-Thinking"   # verify against the current model repo before deploying
        api_key: "not-needed"
        request_timeout_s: 1800                      # CPU/Ollama backends can be well under 2 tok/s
        max_model_len: 16384
        guided_decoding_backend: "xgrammar"
        default_sampling:
          temperature: 0.2
          top_p: 0.9
          max_tokens: 4096
    light:
      label: "Light — DictaLM-3.0-12B"
      min_memory_gb: 8
      llm:
        backend: "vllm"
        base_url: "http://vllm-dictalm-light:8000/v1"
        model: "dicta-il/DictaLM-3.0-12B"            # placeholder -- verify the exact 12B repo name before deploying
        api_key: "not-needed"
        request_timeout_s: 1200
        max_model_len: 16384
        guided_decoding_backend: "xgrammar"
        default_sampling:
          temperature: 0.2
          top_p: 0.9
          max_tokens: 4096
  retrieval:
    vectordb_dir: "./data/legal_vectordb"
    embedding_model: "BAAI/bge-m3"             # multilingual: non-Hebrew queries still match Hebrew statutes
    top_k: 6
    fetch_k: 24                                # candidates before dedupe + MMR cut them to top_k
    mmr_lambda: 0.7                            # 1.0 = pure relevance; lower favours diverse sections
    low_relevance_distance: 0.55               # cosine distance; tune against real queries
    min_relevant_chunks: 2
    max_cross_refs: 4
  ingestion:
    sources_dir: "./data/legal/sources"        # official texts + <file>.meta.json sidecars
    legal_txt_dir: "./legal_txt"               # drop-in law PDFs, indexed by scripts/ingest_legal_txt.py
    uploads_dir: "./uploads"                   # memos / firm / client documents (always need sign-off)
    staging_dir: "./data/legal/staging"
    bundle_manifest: "./data/legal/signed_bundle.json"   # HMAC key: DOCSLIDES_LEGAL_BUNDLE_KEY env var
    chunk_max_tokens: 500                      # soft; structural boundaries always win
  pipeline:
    max_memo_revisions: 2
    max_draft_revisions: 1
    max_polish_attempts: 2
    entailment_concurrency: 4
  audit_dir: "./data/legal/audit"

canon:
  # Canon GPT tab: a genuine RAG pipeline (src/docslides/canon/) over the
  # Code of Canon Law (CIC 1983), Code of Canons of Eastern Churches (CCEO
  # 1990, Latin only -- see scripts/ingest_canon_law.py header for why), and
  # Vatican City State civil law, ingested offline into a local ChromaDB
  # store. `generation` defaults to the general `llm:` model below (no
  # dedicated deployment needed, unlike the Legal tab's separate DictaLM) --
  # override it independently only if you want a different model answering
  # canon-law questions.
  vectordb_dir: "./data/canon_vectordb"
  embedding_model: "BAAI/bge-m3"          # local sentence-transformers model, runs on CPU
  top_k: 8
  generation:
    backend: "vllm"
    base_url: "http://vllm:8000/v1"
    model: "Qwen/Qwen3.5-32B-AWQ"
    api_key: "not-needed"
    request_timeout_s: 600
    max_model_len: 8192
    guided_decoding_backend: "xgrammar"
    default_sampling:
      temperature: 0.2
      top_p: 0.9
      max_tokens: 2048

vllm_launch:
  # Reference command used at deploy time to sanity-check the served model
  # matches this config. See scripts/verify_vllm_launch.py.
  quantization: "awq"                     # bf16 | awq | gptq
  gpu_memory_utilization: 0.90
  port: 8000

paths:
  data_dir: "./data"
  upload_dir: "./data/uploads"
  output_dir: "./data/outputs"
  cache_dir: "./data/cache"
  template_potx: "./assets/templates/default.potx"
  glossary_dir: "./data/glossaries"

languages:
  supported: ["en", "fr", "es", "it", "de", "ar", "he"]
  rtl: ["ar", "he"]
  # spaCy/Stanza model identifiers per language, used by cleaning/segmentation.py
  spacy_models:
    en: "en_core_web_sm"
    fr: "fr_core_news_sm"
    es: "es_core_news_sm"
    it: "it_core_news_sm"
    de: "de_core_news_sm"
  stanza_models:
    # Stanza covers languages spaCy has no small pipeline for (ar, he).
    ar: "ar"
    he: "he"
  fasttext_model_path: "./models/lid.176.bin"

ocr:
  # Engine routing per language. "primary" is tried first; "fallback_cpu" is a
  # lightweight CPU fallback; "fallback_gpu" is the VLM-based escalation path
  # used only when primary/fallback_cpu confidence is below threshold.
  confidence_threshold: 0.80
  engines_by_script:
    latin:
      languages: ["en", "fr", "es", "it", "de"]
      primary: "paddleocr"
      fallback_cpu: "tesseract"
      fallback_gpu: "paddleocr_vl"
    arabic:
      languages: ["ar"]
      primary: "paddleocr_vl"
      fallback_cpu: "tesseract"      # ara.traineddata
      fallback_gpu: "surya"
    hebrew:
      languages: ["he"]
      primary: "surya"
      fallback_cpu: "tesseract"      # heb.traineddata
      fallback_gpu: "paddleocr_vl"
  tesseract:
    lang_codes:
      en: "eng"
      fr: "fra"
      es: "spa"
      it: "ita"
      de: "deu"
      ar: "ara"
      he: "heb"
  gpu_arbiter:
    # Never hold a GPU OCR model resident while vLLM is actively generating a
    # batch. The arbiter is a cooperative lock the OCR fallback must acquire
    # before loading itself onto the GPU, and it yields immediately if vLLM
    # reports an active generation.
    poll_interval_s: 1.0
    max_wait_s: 30.0

scan_detection:
  # Used by the PyMuPDF fallback when MinerU is unavailable for an input type.
  min_chars_per_page_area: 0.0008   # extractable chars / page area (pt^2)

cleaning:
  header_footer_repetition_threshold: 0.6   # fraction of pages a line must repeat on
  max_chunk_tokens: 1500
  mask_categories: ["number", "unit", "named_entity", "placeholder", "formula"]

translation:
  glossary_max_terms: 200

slides:
  default_bullet_count: 4
  max_bullets_per_slide: 6
  layouts: ["title_bullets", "two_column", "section_header", "image_caption", "quote"]
  schema_retry_attempts: 2

tone_control:
  professionalism_levels:
    1: { label: "Casual", temp_cap: 1.0 }
    2: { label: "Conversational", temp_cap: 0.9 }
    3: { label: "Standard business", temp_cap: 0.8 }
    4: { label: "Formal", temp_cap: 0.6 }
    5: { label: "Executive/Legal", temp_cap: 0.4 }
  creativity_levels:
    1: { label: "Minimal", temperature: 0.2, top_p: 0.85 }
    2: { label: "Low", temperature: 0.4, top_p: 0.90 }
    3: { label: "Balanced", temperature: 0.6, top_p: 0.92 }
    4: { label: "High", temperature: 0.85, top_p: 0.95 }
    5: { label: "Maximum", temperature: 1.0, top_p: 0.97 }

logging:
  level: "INFO"
  json: true
